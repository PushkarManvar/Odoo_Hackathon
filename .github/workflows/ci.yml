# CI - Hackathon project
# Runs on every pull request and on pushes to main.
# Enforces lint + typecheck + build before merge.
# Adjust the step list to match the project's actual package.json scripts.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guard: no package.json yet (stack TBD) -> skip Node steps, stay green
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint
      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck
      - name: Test
        if: hashFiles('package.json') != ''
        run: npm run test
      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build
